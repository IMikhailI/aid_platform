openapi: 3.0.3
info:
  title: Aid Platform API
  version: 1.0.0
  description: 'API для платформы адресной помощи: заявка, модерация, помощь, закрытие
    кейса'
paths:
  /api/applicant/profile/:
    get:
      operationId: applicant_profile_retrieve
      summary: Получить профиль текущего applicant
      tags:
      - applicant-profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantProfile'
          description: ''
        '403':
          description: Недостаточно прав
    patch:
      operationId: applicant_profile_update
      summary: Обновить профиль текущего applicant
      tags:
      - applicant-profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplicantProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplicantProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplicantProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantProfile'
          description: ''
        '400':
          description: Ошибка валидации профиля
        '403':
          description: Недостаточно прав
  /api/applicant/requests/{request_id}/confirm-receipt/:
    post:
      operationId: applicant_receipt_confirm
      summary: Подтвердить получение помощи
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - applicant-fulfillment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptConfirmation'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
  /api/applicant/requests/{request_id}/fulfillment/:
    get:
      operationId: applicant_fulfillment_retrieve
      summary: Получить fulfillment собственной заявки
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - applicant-fulfillment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantFulfillmentResponse'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          description: Fulfillment не найден
  /api/applicant/verification/history/:
    get:
      operationId: applicant_verification_history
      summary: Получить собственную историю верификации
      tags:
      - applicant-verification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicantVerificationHistory'
          description: ''
        '403':
          description: Недостаточно прав
  /api/applicant/verification/submit/:
    post:
      operationId: applicant_verification_submit
      summary: Отправить профиль на верификацию
      tags:
      - applicant-verification
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantVerificationSummary'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationError'
          description: ''
        '403':
          description: Недостаточно прав
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationError'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/fraud/requests/{request_id}/checks/:
    get:
      operationId: fraud_checks_list
      summary: Получить fraud-сигналы заявки
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - fraud
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFraudCheckList'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          description: Заявка не найдена
  /api/fraud/requests/{request_id}/decision/:
    get:
      operationId: fraud_decision_retrieve
      summary: Получить актуальное fraud-решение
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - fraud
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudDecision'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          description: Заявка или fraud decision не найдены
  /api/fraud/requests/{request_id}/override/:
    post:
      operationId: fraud_override_create
      summary: Ручное изменение effective fraud action
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - fraud
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FraudOverrideCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FraudOverrideCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FraudOverrideCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudOverride'
          description: ''
        '400':
          description: Недопустимое action или отсутствует непустая причина
        '403':
          description: Недостаточно прав
        '404':
          description: Заявка или fraud decision не найдены
  /api/fraud/requests/{request_id}/recheck/:
    post:
      operationId: fraud_recheck_create
      summary: Повторно выполнить fraud-проверку
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - fraud
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudRecheckResponse'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          description: Заявка не найдена
  /api/helper/my-help/:
    get:
      operationId: helper_owned_requests_list
      description: Privacy-safe список собственных HelpCommitment с безопасной сводкой
        fulfillment. Applicant identity, fraud, verification, telemetry и полный certificate_code
        не возвращаются.
      summary: Получить заявки, взятые текущим helper
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - helper-requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHelperOwnedRequestList'
          description: ''
        '403':
          description: Недостаточно прав
  /api/helper/requests/{request_id}/fulfillment/:
    get:
      operationId: helper_fulfillment_retrieve
      summary: Получить собственный fulfillment
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - helper-fulfillment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelperFulfillment'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
    post:
      operationId: helper_fulfillment_create
      summary: Создать демонстрационный сертификат
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - helper-fulfillment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FulfillmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FulfillmentCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelperFulfillment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
  /api/helper/requests/{request_id}/fulfillment/deliver/:
    post:
      operationId: helper_fulfillment_deliver
      summary: Отметить сертификат переданным
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - helper-fulfillment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelperFulfillment'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
  /api/moderation/requests/{request_id}/fulfillment/:
    get:
      operationId: moderation_fulfillment_retrieve
      summary: Получить служебные сведения fulfillment
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - moderation-fulfillment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratorFulfillment'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          description: Fulfillment не найден
  /api/moderation/verifications/:
    get:
      operationId: moderation_verification_list
      summary: Получить очередь верификаций
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
        description: Регион applicant, регистронезависимое точное совпадение
      - in: query
        name: status
        schema:
          type: string
          enum:
          - pending
          - rejected
          - verified
        description: Фильтр статуса; по умолчанию pending
      tags:
      - moderation-verification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedModeratorVerificationList'
          description: ''
        '403':
          description: Недостаточно прав
  /api/moderation/verifications/{id}/:
    get:
      operationId: moderation_verification_retrieve
      summary: Получить верификацию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - moderation-verification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratorVerification'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          description: Verification не найдена
  /api/moderation/verifications/{id}/decision/:
    post:
      operationId: moderation_verification_decide
      summary: Принять решение по верификации
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - moderation-verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerificationDecision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationDecision'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratorVerification'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationError'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          description: Verification не найдена
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationError'
          description: ''
  /api/requests/{request_id}/history/:
    get:
      operationId: request_history_retrieve
      summary: История статусов заявки
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - request-history
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestHistoryByRole'
          description: ''
  /api/requests/applicant/create/:
    post:
      operationId: requests_applicant_create_create
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AidRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AidRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AidRequestCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AidRequestCreate'
          description: ''
  /api/requests/applicant/my/:
    get:
      operationId: requests_applicant_my_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicantAidRequestList'
          description: ''
  /api/requests/close/{request_id}/:
    patch:
      operationId: applicant_receipt_confirm_deprecated
      description: Applicant подтверждает получение; helper не может закрыть заявку.
      summary: Deprecated alias подтверждения получения
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - applicant-fulfillment
      security:
      - jwtAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptConfirmation'
          description: ''
        '403':
          description: Недостаточно прав
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentError'
          description: ''
  /api/requests/helper/take/{request_id}/:
    post:
      operationId: helper_request_take
      description: Helper/admin берёт опубликованную заявку в работу
      summary: Взять заявку в работу
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - helper-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpCommit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HelpCommit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HelpCommit'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelperAidRequest'
          description: ''
        '400':
          description: Ошибка валидации
        '403':
          description: Недостаточно прав
        '404':
          description: Заявка не найдена
  /api/requests/moderation/{request_id}/:
    post:
      operationId: moderation_request_decide
      description: 'Moderator/admin: approve или reject заявки в очереди модерации'
      summary: Модерация заявки
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - request-moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusTransitionResponse'
          description: ''
        '400':
          description: Ошибка валидации или недопустимый lifecycle-переход
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudPolicyError'
          description: 'Approve запрещён: effective action=block (fraud_publication_blocked)
            или решение отсутствует (fraud_decision_missing)'
        '403':
          description: Недостаточно прав
        '404':
          description: Заявка не найдена
  /api/requests/moderation/queue/:
    get:
      operationId: requests_moderation_queue_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - children
          - clothes
          - food
          - medicine
          - other
        description: |-
          * `food` - Еда
          * `children` - Детские товары
          * `medicine` - Лекарства
          * `clothes` - Одежда
          * `other` - Другое
      - in: query
        name: is_flagged
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedModeratorAidRequestList'
          description: ''
  /api/requests/published/:
    get:
      operationId: requests_published_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - children
          - clothes
          - food
          - medicine
          - other
        description: |-
          * `food` - Еда
          * `children` - Детские товары
          * `medicine` - Лекарства
