services:
  db:
    image: postgres:16
    container_name: aid_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - aid_network

  backend:
    build: ./backend
    container_name: aid_backend
    command: sh /app/entrypoint.sh
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - aid_network

  frontend:
    image: node:20-alpine
    container_name: aid_frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend-v2:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - aid_network

volumes:
  pg_data:

networks:
  aid_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
